<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' blob: data: https:; connect-src 'self' https://api.github.com; frame-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <title>nosk</title>
    <meta name="description" content="Your Obsidian vault on every device, straight from GitHub.">
    <meta name="theme-color" content="#06070b">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap">
    <script src="js/theme-boot.js"></script>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/palettes.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/picker.css">
    <link rel="stylesheet" href="css/vault.css">
    <link rel="stylesheet" href="css/print.css" media="print">
    <link rel="stylesheet" href="lib/katex/katex.min.css">
    <link rel="stylesheet" id="hljs-theme" href="lib/highlight-github-dark.min.css">
    <script src="lib/purify.min.js" defer></script>
    <script src="lib/marked.min.js" defer></script>
    <script src="lib/highlight.min.js" defer></script>
    <script src="lib/katex/katex.min.js" defer></script>
    <script type="module" src="js/vault/app.js"></script>
</head>
<body>
    <div class="atmos" aria-hidden="true"><div class="atmos-glow"></div><div class="atmos-grid"></div></div>

    <section id="setup" class="setup" hidden></section>

    <div id="app" class="app" hidden>
        <aside id="sidebar" class="sidebar" aria-label="Vault">
            <div class="sidebar__brand">
                <a class="brand" href="#/">nosk<span class="cursor" aria-hidden="true"></span></a>
                <div class="sidebar__brand-actions">
                    <button id="sync-status" type="button" class="sync-status" data-state="idle">
                        <span class="sync-status__dot" aria-hidden="true"></span>
                        <span class="sync-status__label">synced</span>
                    </button>
                    <button id="close-sidebar" type="button" class="icon-btn" title="Close sidebar (Ctrl/⌘+\)" aria-label="Close sidebar">«</button>
                </div>
            </div>

            <button id="open-palette" type="button" class="search-trigger">
                <span><span class="accent">&gt;</span> open a note</span>
                <kbd>⌘K</kbd>
            </button>

            <div class="tree-toolbar">
                <input id="tree-filter" class="sidebar__filter" type="search" placeholder="filter files…" aria-label="Filter files">
                <button id="new-note" type="button" class="icon-btn" title="New note (Alt+N)" aria-label="New note">+</button>
                <button id="collapse-tree" type="button" class="icon-btn" title="Collapse all folders" aria-label="Collapse all folders">⊟</button>
            </div>
            <nav id="tree" class="sidebar__nav tree" aria-label="Files"></nav>

            <footer class="sidebar__footer">
                <div class="sidebar__footer-row">
                    <span id="vault-name" class="sidebar__user"></span>
                    <button id="open-settings" type="button" class="link-btn">settings</button>
                </div>
            </footer>
            <div id="sidebar-resizer" class="sidebar__resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar (arrow keys; double-click to reset)" tabindex="0"></div>
        </aside>
        <div id="scrim" class="scrim" aria-hidden="true"></div>

        <main id="main" class="main">
            <header class="topbar">
                <button id="toggle-sidebar" type="button" class="icon-btn topbar__menu" title="Open sidebar (Ctrl/⌘+\)" aria-label="Open sidebar">☰</button>
                <div class="topbar__spacer"></div>
                <button id="open-today" type="button" class="btn btn-ghost btn-sm" title="Today's note (Alt+D)">today</button>
                <button id="open-search" type="button" class="btn btn-ghost btn-sm" title="Search all notes">search <kbd>/</kbd></button>
            </header>
            <div id="view" class="view"></div>
        </main>
    </div>
</body>
</html>
