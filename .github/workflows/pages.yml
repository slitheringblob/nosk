# Publishes the static app in frontend/ to GitHub Pages (nosk.jaydeepganatra.dev).
# There is no build step: tests run, then the shipped files are copied as-is.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # deploy-pages looks up the uploaded artifact through the Actions API

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Collect site files
        run: |
          mkdir -p _site/js
          cp -r frontend/index.html frontend/sw.js frontend/manifest.webmanifest frontend/assets frontend/css frontend/lib _site/
          cp frontend/js/theme-boot.js frontend/js/markdown.js frontend/js/sanitize.js frontend/js/sidebar-layout.js \
             frontend/js/theme.js frontend/js/ui.js frontend/js/utils.js _site/js/
          cp -r frontend/js/vault _site/js/vault

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
